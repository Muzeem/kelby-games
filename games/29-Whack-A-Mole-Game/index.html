<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Whack-a-Mole - Classic arcade game!">
    <meta name="theme-color" content="#fff9e2">
    <title>Whack-a-Mole - Kelby Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>Whack-a-Mole!</h1>
    <div class="game-info">
        <div class="info-item">
            <span class="label">Stage:</span>
            <span class="stage">1</span>
        </div>
        <div class="info-item">
            <span class="label">Score:</span>
            <span class="score">0</span>
        </div>
        <div class="info-item">
            <span class="label">Target:</span>
            <span class="target">5</span>
        </div>
        <div class="info-item">
            <span class="label">Time:</span>
            <span class="timer">30</span>s
        </div>
    </div>
    <button id="start" onClick="startGame()">Start Game</button>
    <div class="game">
        <div class="hole hole1">
            <div class="mole"></div>
        </div>
        <div class="hole hole2">
            <div class="mole"></div>
        </div>
        <div class="hole hole3">
            <div class="mole"></div>
        </div>
        <div class="hole hole4">
            <div class="mole"></div>
        </div>
        <div class="hole hole5">
            <div class="mole"></div>
        </div>
        <div class="hole hole6">
            <div class="mole"></div>
        </div>
    </div>
    <div class="controls">
        <button id="backBtn" class="btn">← Back to Games</button>
    </div>
    
    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over!</h2>
            <p id="modalMessage"></p>
            <button onclick="restartGame()">Play Again</button>
            <button onclick="window.location.href='/'">Back to Games</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
